<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Image Resizer (Square 800x800 + Black BG)</title>
    <style>
        body { font-family: sans-serif, Tahoma; padding: 20px; background: #f4f4f9; color: #333; max-width: 600px; margin: auto; }
        .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; }
        h2 { font-size: 1.2rem; margin-top: 0; color: #007bff; }
        label { display: block; margin-top: 10px; font-size: 0.9rem; font-weight: bold; }
        input[type="file"] { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
        button { background: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:active { background: #218838; }
        #log { margin-top: 15px; font-size: 0.85rem; background: #e9ecef; padding: 10px; border-radius: 6px; max-height: 150px; overflow-y: auto; }
    </style>
</head>
<body>

    <h2>🍱 ปรับรูปอาหารเป็น 800x800 (พื้นหลังดำ จัดกึ่งกลาง)</h2>
    
    <div class="card">
        <label>1. เลือกรูปภาพ (หลายรูปพร้อมกัน):</label>
        <input type="file" id="upload" multiple accept="image/*">

        <button onclick="processImages()">เริ่มประมวลผลและดาวน์โหลด</button>
    </div>

    <div class="card">
        <h3>สถานะการทำงาน:</h3>
        <div id="log">รอเลือกรูปภาพ...</div>
    </div>

<script>
async function processImages() {
    const fileInput = document.getElementById('upload');
    const targetSize = 800; // ล็อกขนาดมาตรฐาน 800x800 พิกเซล
    const qualityInput = 0.8; // คุณภาพความคมชัด 80%
    const logDiv = (msg) => document.getElementById('log').innerHTML += msg + '<br>';

    if (fileInput.files.length === 0) {
        alert('กรุณาเลือกรูปภาพอย่างน้อย 1 รูป');
        return;
    }

    document.getElementById('log').innerHTML = 'กำลังเริ่มประมวลผล...<br>';

    for (let file of fileInput.files) {
        await new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = targetSize;
                    canvas.height = targetSize;
                    const ctx = canvas.getContext('2d');

                    // 1. เติมพื้นหลังสีดำให้เต็มกรอบ 800x800 ก่อน
                    ctx.fillStyle = '#000000';
                    ctx.fillRect(0, 0, targetSize, targetSize);

                    // 2. คำนวณสเกลภาพต้นฉบับไม่ให้เบี้ยว
                    let w = img.width;
                    let h = img.height;
                    let drawW = targetSize;
                    let drawH = targetSize;
                    let offsetX = 0;
                    let offsetY = 0;

                    if (w > h) {
                        // รูปแนวนอน: ปรับความกว้างให้เต็ม 800 แล้วคำนวณความสูงตามสเกล
                        drawH = Math.round((h * targetSize) / w);
                        offsetY = Math.round((targetSize - drawH) / 2); // จัดให้อยู่กึ่งกลางแนวตั้ง
                    } else {
                        // รูปแนวตั้งหรือจัตุรัส: ปรับความสูงให้เต็ม 800 แล้วคำนวณความกว้างตามสเกล
                        drawW = Math.round((w * targetSize) / h);
                        offsetX = Math.round((targetSize - drawW) / 2); // จัดให้อยู่กึ่งกลางแนวนอน
                    }

                    // 3. วาดรูปลงบนผ้าใบตรงกลาง พื้นที่เหลือจะเป็นสีดำอัตโนมัติ
                    ctx.drawImage(img, offsetX, offsetY, drawW, drawH);

                    // 4. บันทึกผลลัพธ์เป็นไฟล์เดิมและใช้ชื่อเดิมเป๊ะๆ
                    canvas.toBlob((blob) => {
                        const link = document.createElement('a');
                        link.href = URL.createObjectURL(blob);
                        link.download = file.name; // คงชื่อเดิม
                        link.click();
                        
                        logDiv(`✅ สำเร็จ: ${file.name} (${Math.round(blob.size / 1024)} KB)`);
                        resolve();
                    }, file.type, qualityInput);
                };
            };
        });
    }
    logDiv('🎉 เสร็จสิ้นทุกรูปภาพแล้ว!');
}
</script>

</body>
</html>
