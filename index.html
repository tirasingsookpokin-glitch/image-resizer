<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Image Resizer (Fix Multi-Download)</title>
    <style>
        body { font-family: sans-serif, Tahoma; padding: 20px; background: #f4f4f9; color: #333; max-width: 600px; margin: auto; }
        .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; }
        h2 { font-size: 1.2rem; margin-top: 0; color: #007bff; }
        label { display: block; margin-top: 10px; font-size: 0.9rem; font-weight: bold; }
        input[type="file"] { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
        button { background: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:active { background: #218838; }
        #log { margin-top: 15px; font-size: 0.85rem; background: #e9ecef; padding: 10px; border-radius: 6px; max-height: 150px; overflow-y: auto; }
    </style>
</head>
<body>

    <h2>🍱 ปรับรูปอาหาร (ดาวน์โหลดครบทุกรูป ไม่ตกหล่น)</h2>
    
    <div class="card">
        <label>1. เลือกรูปภาพ (หลายรูปพร้อมกัน):</label>
        <input type="file" id="upload" multiple accept="image/*">

        <button onclick="processImages()">เริ่มประมวลผลและดาวน์โหลด</button>
    </div>

    <div class="card">
        <h3>สถานะการทำงาน:</h3>
        <div id="log">รอเลือกรูปภาพ...</div>
    </div>

<script>
async function processImages() {
    const fileInput = document.getElementById('upload');
    const targetSize = 800;
    const qualityInput = 0.8;
    const logDiv = (msg) => document.getElementById('log').innerHTML += msg + '<br>';

    if (fileInput.files.length === 0) {
        alert('กรุณาเลือกรูปภาพอย่างน้อย 1 รูป');
        return;
    }

    document.getElementById('log').innerHTML = 'กำลังเริ่มประมวลผล...<br>';

    let index = 0;
    for (let file of fileInput.files) {
        index++;
        await new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = async () => {
                    const fileSizeKB = file.size / 1024;
                    const imgWidth = img.width;
                    const imgHeight = img.height;

                    // เงื่อนไขเดิม: ถ้ารูปเล็กหรือเบาอยู่แล้ว ใช้ไฟล์เดิม
                    if (fileSizeKB < 200 || (imgWidth <= targetSize && imgHeight <= targetSize)) {
                        const link = document.createElement('a');
                        link.href = event.target.result;
                        link.download = file.name;
                        link.click();
                        
                        logDiv(`⏭️ [${index}] ข้าม (รูปเล็ก): ${file.name}`);
                        
                        // หน่วงเวลา 300 มิลลิวินาที เพื่อให้เบราว์เซอร์ไม่บล็อกการดาวน์โหลดหลายไฟล์
                        setTimeout(resolve, 300);
                        return;
                    }

                    // ถ้ารูปใหญ่ ทำการย่อ 800x800 + เติมขอบดำ
                    const canvas = document.createElement('canvas');
                    canvas.width = targetSize;
                    canvas.height = targetSize;
                    const ctx = canvas.getContext('2d');

                    ctx.fillStyle = '#000000';
                    ctx.fillRect(0, 0, targetSize, targetSize);

                    let drawW = targetSize;
                    let drawH = targetSize;
                    let offsetX = 0;
                    let offsetY = 0;

                    if (imgWidth > imgHeight) {
                        drawH = Math.round((imgHeight * targetSize) / imgWidth);
                        offsetY = Math.round((targetSize - drawH) / 2);
                    } else {
                        drawW = Math.round((imgWidth * targetSize) / imgHeight);
                        offsetX = Math.round((targetSize - drawW) / 2);
                    }

                    ctx.drawImage(img, offsetX, offsetY, drawW, drawH);

                    canvas.toBlob((blob) => {
                        const link = document.createElement('a');
                        link.href = URL.createObjectURL(blob);
                        link.download = file.name;
                        link.click();
                        
                        logDiv(`✅ [${index}] สำเร็จ: ${file.name} (${Math.round(blob.size / 1024)} KB)`);
                        
                        // หน่วงเวลา 300 มิลลิวินาที ให้เบราว์เซอร์เซฟไฟล์ทัน
                        setTimeout(resolve, 300);
                    }, file.type, qualityInput);
                };
            };
        });
    }
    logDiv('🎉 ดาวน์โหลดครบทุกรูปภาพแล้ว!');
}
</script>

</body>
</html>
